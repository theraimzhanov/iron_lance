<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Iron Lance — Prototype</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #1a1612; font-family: system-ui, sans-serif; }
  canvas { width: 100%; height: 100%; display: block; touch-action: none; }
  #hud { position: fixed; top: 12px; left: 12px; color: #f3e9d2; background: rgba(0,0,0,.45); padding: 10px 14px; border-radius: 8px; font-size: 14px; line-height: 1.5; pointer-events: none; }
  #score { position: fixed; top: 12px; right: 16px; color: #f3e9d2; font-size: 28px; font-weight: 800; text-shadow: 0 2px 8px #000; pointer-events: none; }
  #msg { position: fixed; top: 22%; width: 100%; text-align: center; font-size: clamp(22px, 4vw, 44px); font-weight: 800; color: #ffd24a; text-shadow: 0 3px 12px #000; opacity: 0; transition: opacity .25s; pointer-events: none; white-space: pre-line; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hud">Loading horses…</div>
<div id="score"></div>
<div id="msg"></div>
<script src="https://cdn.jsdelivr.net/npm/babylonjs@9.30.0/babylon.js"></script>
<script src="https://cdn.jsdelivr.net/npm/babylonjs-loaders@9.30.0/babylonjs.loaders.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/earcut@2.2.4/dist/earcut.min.js"></script>
<script>
const LANE = 1.0, TRACK_HALF = 55, MAX_SPEED = 14, LANCE_LEN = 4.0, PASSES = 3;
const BOT_AIM_ERROR = 0.28; // metres of aim scatter; lower = harder bot
// Guard: raising the shield turns body hits (+2) into shield hits (+1), but the arm tires after
// GUARD_MAX seconds and your own lance wobbles while guarding — so timing matters.
const GUARD_MAX = 1.2, GUARD_COOLDOWN = 1.5, GUARD_WOBBLE = 0.06;
// Lance break (+1 bonus): a hit landed at speed AND near the centre of the target. Deterministic, so it's skill.
const BREAK_SPEED = 10, BREAK_CENTRE = 0.6; // m/s of the attacker; fraction of the hit zone counted as "centred"
// Dismount (instant victory): unguarded body hit, nearly dead centre, at near full speed. Raising the shield prevents it.
const DISMOUNT_SPEED = 11.5, DISMOUNT_CENTRE = 0.45;

const canvas = document.getElementById("c");
const engine = new BABYLON.Engine(canvas, true);
const scene = new BABYLON.Scene(engine);
const V3 = (x, y, z) => new BABYLON.Vector3(x, y, z), C3 = (r, g, b) => new BABYLON.Color3(r, g, b);

// --- Sky + image-based lighting from a real photographed HDRI (Poly Haven, CC0)
const HDRI_URL = "https://dl.polyhaven.org/file/ph-assets/HDRIs/hdr/2k/meadow_2_2k.hdr";
// No prefilter pass: on integrated GPUs prefiltering a big cube can exceed the OS GPU timeout and lose the WebGL context
const hdr = new BABYLON.HDRCubeTexture(HDRI_URL, scene, 512, false, true, false, false);
scene.environmentTexture = hdr;
const skybox = scene.createDefaultSkybox(hdr, true, 1500, 0);
skybox.applyFog = false;
// Atmospheric haze: barely there across the lists, softening the castle and far field like real air
scene.fogMode = BABYLON.Scene.FOGMODE_EXP2; scene.fogDensity = 0.0026; scene.fogColor = C3(0.5, 0.58, 0.68);

const sun = new BABYLON.DirectionalLight("sun", V3(-0.45, -1, 0.35).normalize(), scene);
sun.intensity = 3.2;
sun.autoUpdateExtends = false; // shadow box follows the player instead of covering the whole 110 m list
sun.orthoLeft = sun.orthoBottom = -22; sun.orthoRight = sun.orthoTop = 22; sun.shadowMinZ = 1; sun.shadowMaxZ = 140;
const shadows = new BABYLON.ShadowGenerator(2048, sun);
// Contact-hardening shadows: sharp where objects touch the ground, softening with distance, like real sunlight
shadows.useContactHardeningShadow = true; shadows.contactHardeningLightSizeUVRatio = 0.04;
shadows.filteringQuality = BABYLON.ShadowGenerator.QUALITY_MEDIUM;
shadows.bias = 0.002; shadows.normalBias = 0.02;

// --- Materials. Poly Haven PBR textures (CC0) for ground and wood; procedural for metal and cloth.
// A few Poly Haven sets name their colour map "albedo" instead of "diff" (a wrong name 404s into Babylon's checkerboard)
const PH_NAMES = { brown_leather: { diff: "albedo" } };
const PH = (id, kind) => `https://dl.polyhaven.org/file/ph-assets/Textures/jpg/1k/${id}/${id}_${(PH_NAMES[id] || {})[kind] || kind}_1k.jpg`;
function pbrTextured(name, id, u, v) {
  const m = new BABYLON.PBRMaterial(name, scene);
  const t = kind => { const tx = new BABYLON.Texture(PH(id, kind), scene); tx.uScale = u; tx.vScale = v; return tx; };
  m.albedoTexture = t("diff"); m.bumpTexture = t("nor_gl"); m.metallicTexture = t("arm");
  m.useAmbientOcclusionFromMetallicTextureRed = m.useRoughnessFromMetallicTextureGreen = m.useMetallnessFromMetallicTextureBlue = true;
  m.metallic = 1; m.roughness = 1;
  return m;
}
// Scanned surface detail (Poly Haven, CC0): real weave, grain and scratches as normal + roughness maps
const scanTex = {};
function phTex(id, kind, u, v) {
  const key = `${id}/${kind}/${u}/${v}`;
  if (!scanTex[key]) { const t = new BABYLON.Texture(PH(id, kind), scene); t.uScale = u; t.vScale = v; scanTex[key] = t; }
  return scanTex[key];
}
function weave(mat, id, u, v, level = 0.7) { mat.bumpTexture = phTex(id, "nor_gl", u, v); mat.bumpTexture.level = level; return mat; }
// Metal/leather from a scan: its albedo tinted, its normal and roughness/AO map; per rider so hit flashes stay separate
function scanMat(name, id, tint, metallic, u, v, useAlbedo = true, roughScale = 1) {
  const m = new BABYLON.PBRMaterial(name, scene);
  if (useAlbedo) m.albedoTexture = phTex(id, "diff", u, v);
  m.albedoColor = C3(...tint); m.roughness = roughScale;
  m.bumpTexture = phTex(id, "nor_gl", u, v); m.metallicTexture = phTex(id, "arm", u, v);
  m.useAmbientOcclusionFromMetallicTextureRed = m.useRoughnessFromMetallicTextureGreen = true;
  m.useMetallnessFromMetallicTextureBlue = false; m.metallic = metallic;
  return m;
}
function pbr(name, colour, metallic, roughness) {
  const m = new BABYLON.PBRMetallicRoughnessMaterial(name, scene);
  m.baseColor = C3(...colour); m.metallic = metallic; m.roughness = roughness;
  return m;
}
// Draw onto a canvas texture (heraldry, striped cloth, flags)
function painted(name, w, h, draw, u = 1, v = 1) {
  const tex = new BABYLON.DynamicTexture(name, { width: w, height: h }, scene, true);
  draw(tex.getContext(), w, h); tex.update(); tex.uScale = u; tex.vScale = v;
  tex.wrapU = tex.wrapV = BABYLON.Texture.WRAP_ADDRESSMODE;
  const m = new BABYLON.PBRMaterial(name, scene);
  m.albedoTexture = tex; m.metallic = 0; m.roughness = 0.85; m.backFaceCulling = false;
  return m;
}
const stripes = (a, b, n) => (g, w, h) => { for (let i = 0; i < n; i++) { g.fillStyle = i % 2 ? b : a; g.fillRect(i * w / n, 0, w / n + 1, h); } };
// Heraldic arms: field + an ordinary (chevron or cross) — each team gets its own
const ARMS = {
  player: { field: "#1d3a8a", charge: "#d9a521", kind: "chevron" },
  bot: { field: "#9b1414", charge: "#efe8d8", kind: "cross" },
};
const drawArms = a => (g, w, h) => {
  g.fillStyle = a.field; g.fillRect(0, 0, w, h); g.fillStyle = a.charge;
  if (a.kind === "cross") { g.fillRect(w * 0.4, 0, w * 0.2, h); g.fillRect(0, h * 0.32, w, h * 0.2); }
  else { g.beginPath(); g.moveTo(0, h * 0.8); g.lineTo(w / 2, h * 0.3); g.lineTo(w, h * 0.8); g.lineTo(w, h * 0.98); g.lineTo(w / 2, h * 0.5); g.lineTo(0, h * 0.98); g.fill(); }
};

const groundMat = pbrTextured("grass", "sparse_grass", 70, 120);
const sandMat = pbrTextured("sand", "sand_01", 12, 95);
const darkWood = pbr("darkWood", [0.07, 0.055, 0.045], 0, 0.7);
const stone = pbrTextured("stone", "castle_wall_slates", 8, 4);
stone.albedoColor = C3(0.72, 0.68, 0.62); // weathered, warmer stone rather than bright grey
const slate = pbrTextured("slate", "roof_slates_02", 4, 2);
const standWood = pbrTextured("standWood", "brown_planks_03", 2, 12);
const LIST_W = 17, LIST_LEN = 2 * TRACK_HALF + 30;

// --- Ground: grass field with a sand list
const ground = BABYLON.MeshBuilder.CreateGround("ground", { width: 260, height: 520, subdivisions: 2 }, scene);
ground.material = groundMat; ground.receiveShadows = true;
const lists = BABYLON.MeshBuilder.CreateGround("lists", { width: LIST_W, height: LIST_LEN }, scene);
lists.position.y = 0.01; lists.material = sandMat; lists.receiveShadows = true;

// --- Tilt: black posts on A-frame feet, a top rail, and patterned cloth draped over it, sagging between posts
const POST_GAP = 2.5, TILT_H = 1.6;
const tiltPost = BABYLON.MeshBuilder.CreateBox("tiltPost", { width: 0.12, height: TILT_H, depth: 0.12 }, scene);
const legL = BABYLON.MeshBuilder.CreateBox("tiltLeg", { width: 0.09, height: 0.95, depth: 0.09 }, scene);
const legR = legL.clone("tiltLegR");
const foot = BABYLON.MeshBuilder.CreateBox("tiltFoot", { width: 0.95, height: 0.07, depth: 0.1 }, scene);
legL.position.set(-0.2, 0.42, 0); legL.rotation.z = -0.5;
legR.position.set(0.2, 0.42, 0); legR.rotation.z = 0.5;
foot.position.y = 0.035; tiltPost.position.y = TILT_H / 2;
const tiltUnit = BABYLON.Mesh.MergeMeshes([tiltPost, legL, legR, foot], true);
tiltUnit.material = darkWood; tiltUnit.position.z = -TRACK_HALF;
shadows.addShadowCaster(tiltUnit); tiltUnit.receiveShadows = true;
for (let z = -TRACK_HALF + POST_GAP; z <= TRACK_HALF; z += POST_GAP) {
  const u = tiltUnit.createInstance("tilt"); u.position.z = z;
}
const rail = BABYLON.MeshBuilder.CreateBox("rail", { width: 0.1, height: 0.1, depth: 2 * TRACK_HALF }, scene);
rail.position.y = TILT_H; rail.material = darkWood;
const drapeMat = painted("drapeCloth", 256, 256, (g, w, h) => {
  g.fillStyle = "#e3b04e"; g.fillRect(0, 0, w, h);
  const bands = [[0.12, 0.05, "#5a3a1c"], [0.22, 0.02, "#7a5226"], [0.42, 0.07, "#5a3a1c"], [0.55, 0.02, "#e2b45a"], [0.7, 0.05, "#5a3a1c"], [0.86, 0.025, "#7a5226"]];
  for (const [y, t, c] of bands) { g.fillStyle = c; g.fillRect(0, y * h, w, t * h); }
  g.fillStyle = "rgba(90,58,28,0.35)"; // woven motif
  for (let x = 0; x < w; x += 16) for (let y = 0.28 * h; y < 0.4 * h; y += 10) g.fillRect(x + (y % 20 ? 8 : 0), y, 6, 4);
  g.fillStyle = "#3b2612"; g.fillRect(0, h - 6, w, 6);
}, 1, 1);
weave(drapeMat, "rough_linen", 2 * TRACK_HALF, 1.2);
for (const side of [-1, 1]) {
  const top = [], bottom = [];
  for (let z = -TRACK_HALF; z <= TRACK_HALF; z += 0.25) {
    const sag = Math.sin(Math.PI * (((z + TRACK_HALF) % POST_GAP) / POST_GAP));
    top.push(V3(side * 0.06, TILT_H + 0.05 - 0.1 * sag, z));
    bottom.push(V3(side * (0.1 + 0.03 * sag), 0.85 - 0.22 * sag, z));
  }
  const drape = BABYLON.MeshBuilder.CreateRibbon("drape", { pathArray: [top, bottom], sideOrientation: BABYLON.Mesh.DOUBLESIDE }, scene);
  drape.material = drapeMat; drapeMat.albedoTexture.uScale = 2 * TRACK_HALF / POST_GAP;
  shadows.addShadowCaster(drape); drape.receiveShadows = true;
}

// --- Palisade walls round the list: planks painted with yellow and red bands
const wallMat = pbrTextured("wall", "brown_planks_03", 40, 1);
wallMat.albedoTexture = painted("wallPaint", 1024, 128, (g, w, h) => {
  g.fillStyle = "#4b3a29"; g.fillRect(0, 0, w, h);
  for (let x = 0; x < w; x += 12) { g.fillStyle = `rgba(0,0,0,${0.1 + Math.random() * 0.15})`; g.fillRect(x, 0, 2, h); }
  for (let x = 0; x < w; x += 256) {
    g.fillStyle = "rgba(214,170,40,0.92)"; g.fillRect(x + 30, 0, 70, h);
    g.fillStyle = "rgba(150,30,30,0.92)"; g.fillRect(x + 130, 0, 34, h);
  }
}).albedoTexture;
wallMat.albedoTexture.uScale = LIST_LEN / 12;
const WALL_H = 2.6, WALL_X = LIST_W / 2;
for (const side of [-1, 1]) {
  const wall = BABYLON.MeshBuilder.CreatePlane("wall", { width: LIST_LEN, height: WALL_H, sideOrientation: BABYLON.Mesh.DOUBLESIDE }, scene);
  wall.position.set(side * WALL_X, WALL_H / 2, 0); wall.rotation.y = side * Math.PI / 2; wall.material = wallMat;
  wall.receiveShadows = true;
  const cap = BABYLON.MeshBuilder.CreateBox("wallCap", { width: 0.3, height: 0.12, depth: LIST_LEN }, scene);
  cap.position.set(side * WALL_X, WALL_H, 0); cap.material = darkWood;
}

// --- Stands behind each wall, packed with a crowd (thin instances: thousands of people, two draw calls)
const flags = [];
// Spectator: shouldered torso + arms, one mesh per pose (arms down / arms raised and cheering)
// Crowd motion on the GPU: every spectator (body, head, hat) bounces at its own rhythm, seeded from its position,
// so thousands of thin instances come alive for free. crowd.amp rises as the knights close and after a hit.
const crowd = { t: 0, amp: 0.02, excite: 0 };
class CrowdBob extends BABYLON.MaterialPluginBase {
  constructor(material) { super(material, "CrowdBob", 200, { CROWDBOB: false }); this._enable(true); }
  prepareDefines(defines) { defines.CROWDBOB = true; }
  getClassName() { return "CrowdBob"; }
  getUniforms() {
    return { ubo: [{ name: "crowdTime", size: 1, type: "float" }, { name: "crowdAmp", size: 1, type: "float" }],
             vertex: "#ifdef CROWDBOB\nuniform float crowdTime;\nuniform float crowdAmp;\n#endif\n" };
  }
  bindForSubMesh(ubo) { ubo.updateFloat("crowdTime", crowd.t); ubo.updateFloat("crowdAmp", crowd.amp); }
  getCustomCode(shaderType) {
    if (shaderType !== "vertex") return null;
    return { CUSTOM_VERTEX_UPDATE_WORLDPOS: `#ifdef CROWDBOB
      { vec3 ip = finalWorld[3].xyz;
        float ph = fract(sin(dot(ip.xz, vec2(12.9898, 78.233))) * 43758.5453);
        worldPos.y += crowdAmp * (0.4 + ph) * max(0.0, sin(crowdTime * (5.0 + ph * 4.0) + ph * 6.2831)); }
      #endif` };
  }
}
const crowdCloth = pbr("crowdCloth", [1, 1, 1], 0, 0.95);
new CrowdBob(crowdCloth);
function makeFigure(name, cheering) {
  const torso = BABYLON.MeshBuilder.CreateCylinder(name, { diameterTop: 0.44, diameterBottom: 0.3, height: 0.62, tessellation: 8 }, scene);
  torso.scaling.x = 0.6;
  const parts = [torso];
  for (const s of [-1, 1]) {
    const arm = BABYLON.MeshBuilder.CreateCapsule(name + "Arm", { radius: 0.055, height: 0.6, tessellation: 6, subdivisions: 1 }, scene);
    if (cheering) { arm.position.set(0, 0.52, s * 0.3); arm.rotation.x = s * 0.45; }
    else { arm.position.set(0, -0.02, s * 0.25); arm.rotation.x = -s * 0.12; }
    parts.push(arm);
  }
  const m = BABYLON.Mesh.MergeMeshes(parts, true);
  m.name = name; m.material = crowdCloth;
  return m;
}
const crowdPoses = [makeFigure("crowdSeated", false), makeFigure("crowdCheer", true)];
const crowdHead = BABYLON.MeshBuilder.CreateSphere("crowdHead", { diameter: 0.22, segments: 4 }, scene);
crowdHead.material = pbr("crowdSkin", [1, 1, 1], 0, 0.7);
new CrowdBob(crowdHead.material);
const clothes = [[0.55, 0.1, 0.08], [0.42, 0.08, 0.06], [0.45, 0.3, 0.15], [0.6, 0.45, 0.25], [0.75, 0.68, 0.52], [0.25, 0.3, 0.15], [0.3, 0.18, 0.1], [0.7, 0.55, 0.15], [0.2, 0.2, 0.22], [0.5, 0.12, 0.1], [0.38, 0.28, 0.2]].map(c => c.map(v => v * 0.75)); // earthy, period cloth
const skins = [[0.85, 0.65, 0.52], [0.75, 0.55, 0.42], [0.6, 0.42, 0.3], [0.9, 0.72, 0.6]];
const poseM = [[], []], poseC = [[], []], headM = [], headC = [];
// Headwear: hoods, brimmed hats, or just hair — each a thin-instance mesh tinted per person
const wearMeshes = {
  hood: BABYLON.MeshBuilder.CreateSphere("crowdHood", { diameter: 0.28, segments: 6, slice: 0.62 }, scene),
  hat: BABYLON.Mesh.MergeMeshes([
    BABYLON.MeshBuilder.CreateCylinder("brim", { diameter: 0.36, height: 0.015, tessellation: 10 }, scene),
    Object.assign(BABYLON.MeshBuilder.CreateCylinder("crown", { diameterTop: 0.17, diameterBottom: 0.21, height: 0.12, tessellation: 10 }, scene), { position: V3(0, 0.06, 0) }),
  ], true),
  hair: BABYLON.MeshBuilder.CreateSphere("crowdHair", { diameter: 0.235, segments: 5, slice: 0.5 }, scene),
};
const wearM = { hood: [], hat: [], hair: [] }, wearC = { hood: [], hat: [], hair: [] };
const hairColours = [[0.08, 0.05, 0.03], [0.2, 0.12, 0.06], [0.35, 0.25, 0.12], [0.05, 0.05, 0.05], [0.45, 0.4, 0.35]];
for (const m of Object.values(wearMeshes)) m.material = crowdCloth;
const pick = a => a[(Math.random() * a.length) | 0];
const TIERS = 7, TIER_D = 1.1, TIER_RISE = 0.75, STAND_X = WALL_X + 0.8;
for (const side of [-1, 1]) {
  for (let i = 0; i < TIERS; i++) {
    const h = 1.6 + i * TIER_RISE;
    const tier = BABYLON.MeshBuilder.CreateBox("tier", { width: TIER_D, height: h, depth: LIST_LEN }, scene);
    tier.position.set(side * (STAND_X + i * TIER_D + TIER_D / 2), h / 2, 0); tier.material = standWood;
    for (let z = -LIST_LEN / 2 + 0.4; z < LIST_LEN / 2; z += 0.52) {
      if (Math.random() < 0.08) continue;
      const x = side * (STAND_X + i * TIER_D + TIER_D * 0.55) + (Math.random() - 0.5) * 0.25;
      const zz = z + (Math.random() - 0.5) * 0.18, standing = Math.random() < 0.35, tall = 0.9 + Math.random() * 0.25;
      const y = h + (standing ? 0.55 : 0.4) * tall;
      const sy = standing ? tall : tall * 0.8, pose = standing && Math.random() < 0.55 ? 1 : 0; // standing fans cheer
      poseM[pose].push(BABYLON.Matrix.Compose(V3(1, sy, 1), BABYLON.Quaternion.Identity(), V3(x, y, zz)));
      poseC[pose].push(...pick(clothes), 1);
      headM.push(BABYLON.Matrix.Translation(x, y + 0.44 * sy, zz));
      const hy = y + 0.44 * sy, roll = Math.random();
      const kind = roll < 0.28 ? "hood" : roll < 0.48 ? "hat" : "hair";
      wearM[kind].push(BABYLON.Matrix.Translation(x, hy + (kind === "hat" ? 0.08 : kind === "hood" ? -0.01 : 0.02), zz));
      wearC[kind].push(...(kind === "hair" ? pick(hairColours) : pick(clothes)), 1);
      headC.push(...pick(skins), 1);
    }
  }
  const back = BABYLON.MeshBuilder.CreateBox("standBack", { width: 0.25, height: 1.6 + TIERS * TIER_RISE + 2, depth: LIST_LEN }, scene);
  back.position.set(side * (STAND_X + TIERS * TIER_D + 0.1), (1.6 + TIERS * TIER_RISE + 2) / 2, 0); back.material = standWood;
  for (let z = -TRACK_HALF; z <= TRACK_HALF; z += 14) flags.push(makeFlag(V3(side * (STAND_X + TIERS * TIER_D + 0.1), 1.6 + TIERS * TIER_RISE + 2, z), 4, side > 0 ? ARMS.player : ARMS.bot));
}
const toBuf = ms => { const b = new Float32Array(ms.length * 16); ms.forEach((m, i) => m.copyToArray(b, i * 16)); return b; };
crowdPoses.forEach((m, i) => {
  m.thinInstanceSetBuffer("matrix", toBuf(poseM[i]), 16); m.thinInstanceSetBuffer("color", new Float32Array(poseC[i]), 4);
  m.thinInstanceRefreshBoundingInfo();
});
crowdHead.thinInstanceSetBuffer("matrix", toBuf(headM), 16); crowdHead.thinInstanceSetBuffer("color", new Float32Array(headC), 4);
crowdHead.thinInstanceRefreshBoundingInfo();
for (const [k, m] of Object.entries(wearMeshes)) {
  m.thinInstanceSetBuffer("matrix", toBuf(wearM[k]), 16); m.thinInstanceSetBuffer("color", new Float32Array(wearC[k]), 4);
  m.thinInstanceRefreshBoundingInfo();
}

// Royal box: a red-and-black striped canopy over the middle of the right-hand stand
(function royalBox() {
  const x = STAND_X + 3.5, y = 1.6 + 3 * TIER_RISE + 2.6;
  const roof = BABYLON.MeshBuilder.CreateBox("royalRoof", { width: 4.5, height: 0.08, depth: 8 }, scene);
  roof.position.set(x, y, 0); roof.rotation.z = 0.15;
  roof.material = weave(painted("royalCloth", 256, 32, stripes("#8e1313", "#1a1a1a", 8), 1, 4), "velour_velvet", 4, 8);
  const valance = BABYLON.MeshBuilder.CreatePlane("valance", { width: 8, height: 0.5, sideOrientation: BABYLON.Mesh.DOUBLESIDE }, scene);
  valance.position.set(x - 2.2, y - 0.3, 0); valance.rotation.y = Math.PI / 2; valance.material = roof.material;
  for (const z of [-3.9, 3.9]) for (const dx of [-2, 2]) {
    const p = BABYLON.MeshBuilder.CreateCylinder("royalPole", { diameter: 0.12, height: 2.8, tessellation: 8 }, scene);
    p.position.set(x + dx, y - 1.4, z); p.material = pbr("gilt", [0.8, 0.6, 0.2], 1, 0.35);
  }
  shadows.addShadowCaster(roof);
})();

// --- Striped pavilions beyond each end of the list
function makeFlag(base, poleH, arms) {
  const pole = BABYLON.MeshBuilder.CreateCylinder("flagPole", { diameter: 0.08, height: poleH, tessellation: 6 }, scene);
  pole.position = base.add(V3(0, poleH / 2, 0)); pole.material = darkWood;
  const flag = BABYLON.MeshBuilder.CreatePlane("flag", { width: 1.2, height: 0.8, sideOrientation: BABYLON.Mesh.DOUBLESIDE }, scene);
  flag.setPivotPoint(V3(-0.6, 0, 0));
  flag.position = base.add(V3(0.6, poleH - 0.45, 0)); flag.rotation.y = Math.PI / 2;
  flag.material = painted("arms" + arms.kind, 128, 96, drawArms(arms));
  flag.phase = Math.random() * 6;
  return flag;
}

    g.beginPath(); g.moveTo(x - 2.5, 128); g.quadraticCurveTo(x + lean * 0.4, 128 - h * 0.6, x + lean, 128 - h); g.lineTo(x + 2.5, 128); g.fill();

// --- Sound: everything synthesised with Web Audio (no files). Browsers only allow audio after a key/click,
// so the context starts on the first input. M toggles mute.
const sfx = (() => {
  let ctx = null, master = null, noise = null, crowdGain = null, muted = false;
  function init() {
    if (ctx) return;
    ctx = new (window.AudioContext || window.webkitAudioContext)();
    const comp = ctx.createDynamicsCompressor(); comp.connect(ctx.destination);
    master = ctx.createGain(); master.gain.value = 0.8; master.connect(comp);
    noise = ctx.createBuffer(1, ctx.sampleRate * 2, ctx.sampleRate);
    const d = noise.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    // Crowd bed: two bands of looping noise (murmur + brighter voices), level follows excitement
    crowdGain = ctx.createGain(); crowdGain.gain.value = 0.04; crowdGain.connect(master);
    for (const [f, q, g] of [[350, 0.6, 1], [1100, 0.9, 0.5]]) {
      const src = ctx.createBufferSource(); src.buffer = noise; src.loop = true;
      const bp = ctx.createBiquadFilter(); bp.type = "bandpass"; bp.frequency.value = f; bp.Q.value = q;
      const lvl = ctx.createGain(); lvl.gain.value = g;
      src.connect(bp).connect(lvl).connect(crowdGain); src.start();
    }
  }
  const out = (gain, pan) => { // a voice's gain → stereo pan → master
    const g = ctx.createGain(); g.gain.value = 0;
    const p = ctx.createStereoPanner(); p.pan.value = Math.max(-1, Math.min(1, pan || 0));
    g.connect(p).connect(master); return g;
  };
  function burst(t, { dur = 0.1, gain = 0.5, type = "lowpass", freq = 400, q = 0.7, pan = 0, attack = 0.003 }) {
    const src = ctx.createBufferSource(); src.buffer = noise;
    const f = ctx.createBiquadFilter(); f.type = type; f.frequency.value = freq; f.Q.value = q;
    const g = out(gain, pan);
    g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(gain, t + attack); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    src.connect(f).connect(g); src.start(t, Math.random() * 1.5, dur + 0.05);
  }
  function tone(t, { freq, dur, gain = 0.3, type = "sine", pan = 0, slide = 1, attack = 0.002 }) {
    const o = ctx.createOscillator(); o.type = type; o.frequency.setValueAtTime(freq, t);
    if (slide !== 1) o.frequency.exponentialRampToValueAtTime(freq * slide, t + dur);
    const g = out(gain, pan);
    g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(gain, t + attack); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); o.start(t); o.stop(t + dur + 0.05);

    init, get ready() { return !!ctx && !muted; },
    toggleMute() { muted = !muted; if (master) master.gain.value = muted ? 0 : 0.8; return muted; },
    hoof(vol, pan) { // a hoof striking packed sand: dull thump plus a gritty scuff
      if (!this.ready || vol < 0.01) return; const t = ctx.currentTime;
      tone(t, { freq: 85, dur: 0.09, gain: 0.5 * vol, pan, slide: 0.6 });

    const sdx = Math.abs(tip.x - s.x) / 0.35, sdy = Math.abs(tip.y - s.y) / 0.32;

    kholder.parent = r.knight; kholder.rotation.y = faceY; kroot.parent = kholder;
    r.armourHolder = kholder; r.leanSign = faceY ? -1 : 1; // pitch is applied before the yaw flip
    r.armourMeshes = kroot.getChildMeshes(false);
    // Scanned worn steel (scratches, polish variation) and leather on the armour
    // steel colour is our own (the scan's colour map is painted plate); scratches + polish variation come from the scan
    const steel = scanMat(r.name + "SteelScan", "metal_plate", [0.8, 0.8, 0.82], 1, 3, 3, false, 0.55);
    const darkSteel = scanMat(r.name + "DarkSteelScan", "metal_plate", [0.08, 0.08, 0.09], 1, 3, 3, false, 0.8);
    const leather = scanMat(r.name + "LeatherScan", "brown_leather", [0.9, 0.7, 0.6], 0, 3, 3);
    for (const m of r.armourMeshes) {
      const n = m.material ? m.material.name : "";
      if (/DarkSteel/.test(n)) m.material = darkSteel;
      else if (/Steel/.test(n)) m.material = steel;
      else if (/Leather/.test(n)) m.material = leather;
    }
    for (const m of r.armourMeshes) { shadows.addShadowCaster(m); m.receiveShadows = true; }
    r.bodyFlash = r.armourMeshes.find(m => m.material && /steel/i.test(m.material.name) && !/dark/i.test(m.material.name)) || r.armourMeshes[0];
    // Caparison: heraldic cloth over the horse's body, dagged hem with a gold border
    r.gallop = inst.animationGroups[0];
    r.gallop.start(true); r.gallop.speedRatio = 0;
    if (!dressed) continue;
    const top = SEAT.y, bottom = 0.68;
    const capa = makeCaparison(r.name, top, bottom);
    capa.parent = r.mount;
    capa.material = painted(r.name + "caparison", 1024, 256, (g, w, h) => {
      g.clearRect(0, 0, w, h);
      g.fillStyle = arms.field; g.fillRect(0, 0, w, h * 0.86);
      for (let x = 0; x < w; x += 64) { g.beginPath(); g.moveTo(x, h * 0.86); g.lineTo(x + 32, h * 0.98); g.lineTo(x + 64, h * 0.86); g.fill(); } // dags
      g.fillStyle = "#d9a521"; g.fillRect(0, h * 0.8, w, h * 0.035);
      for (let x = 64; x < w; x += 256) { g.save(); g.translate(x, h * 0.12); drawArms(arms)(g, 110, 130); g.restore(); }
    });
    capa.material.albedoTexture.hasAlpha = true; capa.material.useAlphaFromAlbedoTexture = true;
    capa.material.transparencyMode = BABYLON.Material.MATERIAL_ALPHATEST;
    capa.material.albedoTexture.vScale = -1; // canvas row 0 = top of the cloth
    weave(capa.material, "caban", 10, 2.5, 0.8); // heavy wool
    shadows.addShadowCaster(capa); capa.receiveShadows = true;
    r.capa = capa;
  }
  newMatch();
}).catch(err => { hud.textContent = "Could not load horse: " + err.message; });

scene.onBeforeRenderObservable.add(() => {
  if (state === "loading") return;
  const dt = Math.min(engine.getDeltaTime() / 1000, 0.05);

  // Player pace: W/↑ to spur, S/↓ to rein in. Bot sets off once the player does.
  if (state === "ready" || state === "riding") {
    const accel = (keys.KeyW || keys.ArrowUp) ? 5 : (keys.KeyS || keys.ArrowDown) ? -8 : -0.6;
    player.speed = BABYLON.Scalar.Clamp(player.speed + accel * dt, 0, MAX_SPEED);
    if (state === "ready" && player.speed > 1) state = "riding";
    if (state === "riding") bot.speed = Math.min(botTargetSpeed, bot.speed + 5 * dt);
  } else {
    for (const r of riders) r.speed = Math.max(0, r.speed - 10 * dt);
  }

  // Player lance: mouse steers across the tilt
  player.yaw = -0.6 + aimX * 0.35;
  player.pitch = 0.05 + aimY * 0.3;
  if (state === "riding") botAim(dt);

  // Guard: Space or right mouse for the player; the bot follows its per-pass plan
  const riding = state === "riding";
  player.wantGuard = riding && (keys.Space || rightMouse);
  const tti = timeToImpact();
  bot.wantGuard = riding && bot.guardAtTTI > 0 && tti < bot.guardAtTTI && tti > -0.3;
  const now = performance.now() / 1000;
  for (const r of riders) {
    updateGuard(r, dt);
    r.wobbleYaw = Math.sin(now * 13 + r.dir) * GUARD_WOBBLE * r.guard;
    r.wobblePitch = Math.sin(now * 17 + r.dir * 2) * GUARD_WOBBLE * r.guard;
  }

  for (const r of riders) {
    r.mount.position.z += r.dir * r.speed * dt;
    if (r.dir * r.mount.position.z > TRACK_HALF) { r.mount.position.z = r.dir * TRACK_HALF; r.speed = 0; }
    if (r.gallop) r.gallop.speedRatio = r.speed / 9;
    r.pivot.rotation.y = r.yaw + r.wobbleYaw; r.pivot.rotation.x = r.pitch + r.wobblePitch;
    r.recoil *= Math.max(0, 1 - dt * 4);
    if (r.capa) flowCaparison(r.capa, r.speed / MAX_SPEED, now, r.speed);
    if (r.dust) r.dust.emitRate = r.speed > 2 ? r.speed * 14 : 0;
    // Hoofbeats: the same four-beat gallop as the animation (hind L, hind R, fore L, fore R), one sound per footfall
    if (r.speed > 0.8) {
      const prev = r.stride || 0, next = prev + dt * (r.speed / 9) / 0.667;
      for (const o of [0, 0.12, 0.42, 0.54]) {
        const a = prev % 1, b = next % 1, crossed = a <= b ? (a < o && o <= b) : (o > a || o <= b);
        if (crossed) { const ear = earOf(r.mount.position); sfx.hoof(ear.vol * Math.min(1, r.speed / 6), ear.pan); }
      }
      r.stride = next;
    }
    // Rider's body: leans into the charge and rocks with the stride. Only the visible armour moves — the lance,
    // shield and hit zones hang off r.knight, so aiming and scoring are unaffected.
    if (r.armourHolder && !r.fall) {
      const sp = r.speed / MAX_SPEED, ph = now * (3 + r.speed);
      r.armourHolder.rotation.x = r.leanSign * (0.07 * sp + 0.03 * sp * Math.sin(ph + 0.6));
      r.armourHolder.rotation.z = 0.02 * sp * Math.sin(ph * 0.5);
    }
    if (r.fall) updateFall(r, dt);
    else {
      r.knight.rotation.x = -r.recoil;
      r.knight.position.y = r.seatY + Math.sin(performance.now() / 1000 * (4 + r.speed)) * 0.006 * r.speed / MAX_SPEED * 6;
    }
    r.mount.computeWorldMatrix(true); r.knight.computeWorldMatrix(true); r.pivot.computeWorldMatrix(true);
    r.tip.computeWorldMatrix(true); r.shield.computeWorldMatrix(true); r.torso.computeWorldMatrix(true);
  }

  updateSplinters(dt);
  if (state === "riding") {
    resolveHit(player, bot); resolveHit(bot, player);
    // A dismount ends the match at once (if both fall, the points decide)
    if ((player.unhorsed || bot.unhorsed) && player.resolved && bot.resolved) {
      state = "done";
      const won = player.unhorsed && bot.unhorsed ? player.score > bot.score : bot.unhorsed;
      say(`${bot.unhorsed && !player.unhorsed ? "You unhorsed your opponent!" : player.unhorsed && !bot.unhorsed ? "You were unhorsed!" : "Both knights unhorsed!"}\n${won ? "Victory" : "Defeat"} — press R for a rematch`, 0);
    }
    if (state === "riding" && player.resolved && bot.resolved && !player.announced) {
      player.announced = true;
      say(`You: ${player.lastResult}\nBot: ${bot.lastResult}`, 1800);
    }
    // Pass over when both riders are past each other and well down the lists
    if (player.resolved && bot.resolved && player.mount.position.z > 25 && bot.mount.position.z < -25) {
      player.announced = false;
      if (pass >= PASSES && player.score !== bot.score) {
        state = "done";
        const won = player.score > bot.score;
        say(`${won ? "Victory!" : "Defeat"}  ${player.score} – ${bot.score}\nPress R for a rematch`, 0);
      } else { state = "between"; betweenT = 2.2; }
    }
  } else if (state === "between") {
    betweenT -= dt;
    if (betweenT <= 0) { pass++; resetPass(); }
  }

  // Sun's shadow box follows the player; banners flutter
  sun.position = player.mount.position.subtract(sun.direction.scale(60));
  for (const f of flags) f.rotation.y = Math.PI / 2 + Math.sin(now * 2.2 + f.phase) * 0.25;
  // Crowd excitement: builds as the knights close on each other, spikes on a hit, then settles
  const closing = state === "riding" ? Math.max(0, 1 - Math.abs(bot.mount.position.z - player.mount.position.z) / 35) : 0;
  crowd.excite = Math.max(0, crowd.excite - dt * 0.35);
  crowd.t = now; crowd.amp = 0.02 + 0.11 * Math.max(closing, crowd.excite);
  sfx.crowd(Math.max(closing * 0.7, crowd.excite));

  // Chase camera: low over the right shoulder, with a slight handheld sway that grows with the gallop
  const want = player.mount.position.add(camOffset);
  camera.position = BABYLON.Vector3.Lerp(camera.position, want, Math.min(1, dt * 4));
  const sway = player.speed / MAX_SPEED;
  camera.position.y += Math.sin(now * (3 + player.speed)) * 0.025 * sway;
  camera.setTarget(player.mount.position.add(V3(-0.8 + Math.sin(now * 1.3) * 0.04 * sway, 2.0, 10)));

  const passLabel = pass > PASSES ? `Extra pass ${pass - PASSES}` : `Pass ${pass} / ${PASSES}`;
  scoreEl.textContent = `You ${player.score} — ${bot.score} Bot`;
  const guardLabel = player.guardCooldown > 0 ? `tired (${player.guardCooldown.toFixed(1)}s)`
    : player.guard > 0.8 ? `UP (${(GUARD_MAX - player.guardHeld).toFixed(1)}s left)` : "ready";
  hud.innerHTML = `<b>IRON LANCE</b> — ${passLabel}<br>W / ↑ spur &nbsp; S / ↓ rein in<br>Mouse: aim lance at the red shield<br>`
    + `Space / right-click: raise shield (max ${GUARD_MAX}s)<br>Shield +1 · Body +2 · Guard blocks body hits<br>`
    + `Centred hit at ≥ ${(BREAK_SPEED * 3.6).toFixed(0)} km/h breaks the lance +1<br>`
    + `Dead-centre body hit at ≥ ${(DISMOUNT_SPEED * 3.6).toFixed(0)} km/h unhorses — instant win<br>`
    + `M: sound on/off<br>`
    + `Speed: ${(player.speed * 3.6).toFixed(0)} km/h &nbsp; Shield: <b>${guardLabel}</b>`
    + (state === "ready" ? "<br><b>Press W to charge</b>" : "");
});

engine.runRenderLoop(() => scene.render());
addEventListener("resize", () => engine.resize());
</script>
</body>
</html>
